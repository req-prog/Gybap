<style>
/* Раскладка: шапка сверху, меню слева (снизу на телефоне), контент справа. Тема: зелёная. */
:root{
  --bg:#f1f7ef; --surface:#ffffff; --surface2:#e3efe0; --line:#cfe1ca;
  --ink:#0e2615; --muted:#5b7562; --accent:#17a548; --accent-ink:#ffffff; --accent-soft:#d3f0dc;
  --danger:#c0392b;
  --f-display:'Unbounded','Arial Black',sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hh:60px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07130b; --surface:#0e2014; --surface2:#16301f; --line:#1f3b29;
  --ink:#e6f6ea; --muted:#8fae98; --accent:#3ddc7a; --accent-ink:#04200f; --accent-soft:#12361f; --danger:#ff7a6b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07130b; --surface:#0e2014; --surface2:#16301f; --line:#1f3b29;
  --ink:#e6f6ea; --muted:#8fae98; --accent:#3ddc7a; --accent-ink:#04200f; --accent-soft:#12361f; --danger:#ff7a6b; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%;display:block}

/* Шапка */
header{position:sticky;top:0;z-index:20;height:var(--hh);display:flex;align-items:center;gap:14px;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:900 22px var(--f-display);letter-spacing:-.02em;color:var(--accent);display:flex;align-items:center;gap:8px}
.logo svg{width:30px;height:30px;flex:none}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.logo i::after{content:"";border-left:9px solid var(--accent-ink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:2px}
.search{flex:1;max-width:520px;margin-inline:auto;display:flex}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px 0 0 999px}
.search button{border:1px solid var(--line);border-left:0;background:var(--surface2);padding:0 16px;border-radius:0 999px 999px 0}
.hright{display:flex;align-items:center;gap:10px;margin-left:auto}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;padding:9px 18px;border-radius:999px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.sub-on{background:var(--surface2);color:var(--muted)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:5px 12px;font-size:13px}
.av{border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 14px var(--f-display);object-fit:cover;flex:none;overflow:hidden}
.menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--hh) - 6px);min-width:220px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.menu a,.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:9px}
.menu a:hover,.menu button:hover{background:var(--surface2)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-weight:800}

/* Каркас */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr)}
nav.side{position:sticky;top:var(--hh);height:calc(100dvh - var(--hh));padding:16px 10px 16px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line)}
nav.side a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;font-weight:700;color:var(--muted)}
nav.side a:hover{background:var(--surface2);color:var(--ink)}
nav.side a.on{background:var(--accent-soft);color:var(--accent)}
nav.side svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{min-width:0;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px 24px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:18px} h3{font-size:15px}
.row{display:flex;align-items:center;gap:12px}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Сетка видео */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 16px;margin-top:18px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.thumb{aspect-ratio:16/9;border-radius:14px;background:var(--surface2) center/cover no-repeat;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.card:hover .thumb{outline:2px solid var(--accent)}
.card .meta{display:flex;gap:10px;min-width:0}
.card .t{font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:13px;color:var(--muted)}
.shelf{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;margin-top:14px;scroll-snap-type:x proximity}
.shelf .card{width:150px;flex:none;scroll-snap-align:start}
.shelf .thumb{aspect-ratio:9/16}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;margin-top:20px}

/* Просмотр */
.watch{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1000px}
.player{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9}
.player.vertical{aspect-ratio:9/16;max-height:78dvh;margin-inline:auto}
.player video{width:100%;height:100%;display:block;background:#000}
.ploading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.6);font-weight:700;text-align:center;padding:20px}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px;width:min(260px,70vw)}
.bar b{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
.pill{border:0;background:var(--surface2);padding:9px 16px;border-radius:999px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.pill.on svg{fill:currentColor}
.desc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.cform{display:flex;gap:10px;align-items:flex-start}
.cform textarea{flex:1;min-width:0;resize:vertical;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px}
.comment{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.comment p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}

/* ГУБАПЫ */
.reels{height:calc(100dvh - var(--hh) - 44px);overflow-y:auto;scroll-snap-type:y mandatory;display:flex;flex-direction:column;align-items:center;gap:16px;scrollbar-width:none}
.reels::-webkit-scrollbar{display:none}
.reel{scroll-snap-align:center;flex:none;height:100%;aspect-ratio:9/16;max-width:100%;position:relative;border-radius:18px;overflow:hidden;background:#000}
.reel video{width:100%;height:100%;object-fit:cover}
.reel .cap{position:absolute;left:0;right:64px;bottom:0;padding:50px 14px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.reel .cap b{display:block}
.reel .side{position:absolute;right:8px;bottom:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.rb.on{background:var(--accent);color:var(--accent-ink)}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.rb.on svg{fill:currentColor}
.rc{color:#fff;font-size:12px;font-weight:800;text-align:center;margin-top:-10px}

/* Канал / Мастерская */
.chead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:6px 0 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stat b{display:block;font:700 28px var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px;font-weight:700}
.tw{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
td .tt{display:flex;align-items:center;gap:12px;min-width:0}
td .tt img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--surface2);flex:none}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}

/* Модалки */
.back{position:fixed;inset:0;z-index:50;background:rgba(0,10,4,.6);display:grid;place-items:center;padding:16px;overflow-y:auto}
.modal{width:min(520px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.modal label{display:grid;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.modal input[type=text],.modal textarea,.modal select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;color:var(--ink);width:100%}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.err{color:var(--danger);font-weight:700;font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;max-width:90vw}
.avpick{display:flex;align-items:center;gap:16px}

.vb{width:1.05em;height:1.05em;vertical-align:-.18em;margin-left:4px;fill:var(--accent)}
.vb path{fill:none;stroke:var(--accent-ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.banbar{background:var(--danger);color:#fff;font-weight:700;font-size:12px;padding:4px 10px;border-radius:99px}
.adm-row{display:flex;gap:6px;flex-wrap:wrap}
.logo{flex:none}
.hright{flex:none}
.hright>*{flex:none}
.btn{white-space:nowrap}
.ibtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ibtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:520px){
  header{gap:8px}
  .logo{font-size:19px;gap:6px}
  .logo svg{width:28px;height:28px}
  .hright{gap:8px}
  .ibtn .il{display:none}
  .ibtn{padding:0;width:38px;height:38px;justify-content:center}
  .ibtn svg{width:18px;height:18px}
}
@media (max-width:320px){.logo span{display:none}}
.steps{margin:0;padding-left:20px;display:grid;gap:8px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;height:50dvh;max-width:560px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:sheetUp .22s ease-out}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .x{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.sheet .sb{flex:1;overflow-y:auto;padding:0 16px;overscroll-behavior:contain}
.sheet .sf{margin:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);align-items:center}
.sheet .comment:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@media (max-width:800px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;z-index:30;background:var(--surface);
    border-right:0;border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
  nav.side a{flex:1;min-width:0;flex-direction:column;align-items:center;gap:2px;font-size:10px;letter-spacing:-.02em;padding:6px 1px;text-align:center}
  nav.side a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:16px max(16px,env(safe-area-inset-right,0px)) 100px max(16px,env(safe-area-inset-left,0px))}
  .reels{height:calc(100dvh - var(--hh) - 90px)}
  .search{display:none}
  .search.open{display:flex;position:absolute;left:12px;right:12px;top:8px;z-index:5}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const SUPABASE_KEY = 'sb_publishable_QxNWmZIdmXDZbUCgppFUpQ_0nykoUyo';

  for (const [n, k] of u) if (s >= k) return rtf.format(-Math.floor(s / k), n);

  document.body.append(e); setTimeout(() => e.remove(), 3200);

function av(p, size = 36) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .4)}px`;

/* ============ Авторизация и профиль ============ */
async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  authUser = session?.user || null; me = null; myLikes = new Set();
  if (authUser) {
    const { data } = await sb.from('profiles').select('*').eq('id', authUser.id).maybeSingle();
    me = data;
    isAdm = !!(await sb.rpc('is_admin')).data;
    const { data: b } = await sb.from('bans').select('*').eq('user_id', authUser.id).maybeSingle();
    myBan = b && (!b.until || new Date(b.until) > new Date()) ? b : null;
  } else { isAdm = false; myBan = null; }
  renderHeader();
  if (authUser && !me) openProfile(true);
}
function login(mode = 'in') {
  const up = mode === 'up';
  $('#modalHost').innerHTML = `<div class="back"><div class="modal" role="dialog" aria-label="Вход">
    <h2>${up ? 'Регистрация' : 'Вход'}</h2>
    <label>Почта<input id="aemail" type="email" autocomplete="email" inputmode="email"></label>
    <label>Пароль${up ? ' (минимум 6 символов)' : ''}<input id="apass" type="password" autocomplete="${up ? 'new-password' : 'current-password'}"></label>
    ${up ? '' : '<a href="#" id="aforgot" class="muted small">Забыли пароль?</a>'}
    <div class="err" id="aerr"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="aswitch">${up ? 'Уже есть аккаунт' : 'Создать аккаунт'}</button>
      <div class="row"><button class="btn ghost" data-act="closeModal">Отмена</button>
      <button class="btn" id="ago">${up ? 'Зарегистрироваться' : 'Войти'}</button></div></div></div></div>`;
  $('#aswitch').onclick = () => login(up ? 'in' : 'up');
  const fg = $('#aforgot');
  if (fg) fg.onclick = async e => {
    e.preventDefault();
    const email = $('#aemail').value.trim(), err = $('#aerr');
    if (!email) { err.textContent = 'Введите почту выше'; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    err.textContent = error ? error.message : 'Письмо для сброса пароля отправлено';
  };
  const go = async () => {
    const email = $('#aemail').value.trim(), password = $('#apass').value, err = $('#aerr'), btn = $('#ago');
    if (!email || !password) { err.textContent = 'Введите почту и пароль'; return; }
    if (up && password.length < 6) { err.textContent = 'Пароль слишком короткий (минимум 6 символов)'; return; }
    btn.disabled = true; err.textContent = '';
    const { data, error } = up
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    if (error) {
      const m = error.message || '';
      err.textContent = /invalid login/i.test(m) ? 'Неверная почта или пароль'
        : /already registered/i.test(m) ? 'Эта почта уже зарегистрирована, нажмите «Уже есть аккаунт»'
        : /rate limit|too many|security purposes/i.test(m) ? 'Supabase ограничил число писем/попыток. Отключите «Confirm email» и поднимите лимиты в Authentication → Rate Limits'
        : /not confirmed/i.test(m) ? 'Подтвердите почту по письму и войдите снова'
        : m;
      return;
    }
    if (up && !data.session) {
      const r = await sb.auth.signInWithPassword({ email, password });
      if (r.error) { err.textContent = 'Нужно подтвердить почту (или отключите «Confirm email» в Supabase → Authentication → Providers → Email).'; return; }
    }
    closeModal();
  };
  $('#ago').onclick = go;
  $('#apass').onkeydown = e => { if (e.key === 'Enter') go(); };
}

    btn.disabled = true; err.textContent = '';
    try {
      let url = me?.avatar_url || g.avatar_url || g.picture || null;
      if (file) {

        const path = `${authUser.id}/avatar-${Date.now()}.${ext}`;

      err.textContent = e.code === '23505' ? 'Этот ник уже занят' : (e.message || 'Ошибка'); btn.disabled = false;

/* ============ Данные ============ */
const SEL = '*, profiles!owner(nick,avatar_url,verified), likes(count), comments(count)';
async function fetchVideos({ kind, owner, q, owners, featured, limit = 60 } = {}) {
  let r = sb.from('videos').select(SEL).order('created_at', { ascending: false }).limit(limit);
  if (kind) r = r.eq('kind', kind);
  if (featured) r = r.not('featured_at', 'is', null).order('featured_at', { ascending: false });
  if (owner) r = r.eq('owner', owner);
  if (owners) r = r.in('owner', owners);
  if (q) r = r.ilike('title', `%${q.replace(/[%_]/g, '')}%`);
  const { data, error } = await r;
  if (error) { toast(error.message); return []; }
  await loadMyLikes(data);
  return data;
}
async function loadMyLikes(list) {
  if (!me || !list.length) return;
  const { data } = await sb.from('likes').select('video_id').eq('user_id', me.id).in('video_id', list.map(v => v.id));
  (data || []).forEach(l => myLikes.add(l.video_id));
}
/* Возвращает адрес, который можно подставить в <video>. Если видео было нарезано, склеивает кусочки. */
const blobCache = new Map();
async function playable(v, onProg) {
  if (v.parts <= 1) return pub('videos', partPath(v, 0));
  if (blobCache.has(v.id)) return blobCache.get(v.id);
  const bufs = [];
  for (let i = 0; i < v.parts; i++) {
    const res = await fetch(pub('videos', partPath(v, i)));
    if (!res.ok) throw new Error('Не удалось скачать часть ' + (i + 1));
    bufs.push(await res.blob());
    onProg && onProg((i + 1) / v.parts);
  }
  const url = URL.createObjectURL(new Blob(bufs, { type: v.mime || 'video/mp4' }));
  blobCache.set(v.id, url);
  return url;
}

async function viewGubaps(startId) {
  app.innerHTML = '<p class="muted">Загрузка…</p>';
  let list = await fetchVideos({ kind: 'gubap', limit: 40 });
  if (startId) { const i = list.findIndex(v => v.id === startId); if (i > 0) list = [list[i], ...list.filter((_, j) => j !== i)]; }
  if (!list.length) { app.innerHTML = '<div class="empty">ГУБАПОВ пока нет. Загрузите первый короткий ролик!</div>'; return; }
  app.innerHTML = `<div class="reels" id="reels">${list.map(v => `<div class="reel" data-id="${v.id}">
    <video playsinline loop muted preload="none" ${v.thumb_url ? `poster="${esc(v.thumb_url)}"` : ''}></video>
    <div class="cap"><b>@${esc(v.profiles?.nick)}${chk(v.profiles)}</b><span>${esc(v.title)}</span></div>
    <div class="side">
      <a href="#/channel/${v.owner}">${av(v.profiles, 46)}</a>
      <button class="rb ${myLikes.has(v.id) ? 'on' : ''}" data-act="like" data-id="${v.id}" aria-label="Нравится">${icon.like}</button><div class="rc" data-ln="${v.id}">${cnt(v.likes)}</div>
      <button class="rb" data-act="gcom" data-id="${v.id}" aria-label="Комментарии">${icon.chat}</button><div class="rc" data-cn="${v.id}">${cnt(v.comments)}</div>
      <button class="rb" data-act="sound" aria-label="Звук">${icon.sound}</button>
    </div></div>`).join('')}</div>`;
  const map = new Map(list.map(v => [v.id, v]));
  const io = new IntersectionObserver(async ents => {
    for (const e of ents) {
      const el = e.target, vid = $('video', el), v = map.get(el.dataset.id);
      if (e.isIntersecting) {
        if (!vid.src) { try { vid.src = await playable(v); } catch { continue; } sb.rpc('add_view', { vid: v.id }); }
        vid.muted = !soundOn; vid.play().catch(() => {});
      } else vid.pause();
    }
  }, { root: $('#reels'), threshold: .7 });
  $$('.reel').forEach(r => { io.observe(r); $('video', r).onclick = ev => ev.target.paused ? ev.target.play() : ev.target.pause(); });
  if (startId) $('.reel').scrollIntoView();
  cleanup = () => io.disconnect();
}

function openUpload() {
  if (needLogin()) return;
  $('#modalHost').innerHTML = `<div class="back"><div class="modal" role="dialog" aria-label="Загрузка">
    <h2>Загрузить видео</h2>
    <label class="drop">Выберите файл (любого размера, большие режутся по 50 МБ)<br><input id="ufile" type="file" accept="video/*" style="margin-top:10px"></label>
    <label>Тип<select id="ukind"><option value="video">Обычное видео</option><option value="gubap">ГУБАП (короткое вертикальное, до ${GUBAP_MAX_SEC / 60} мин)</option></select></label>
    <label>Название<input id="utitle" type="text" maxlength="120"></label>
    <label>Описание<textarea id="udesc" rows="3" maxlength="2000"></textarea></label>
    <div id="uprog" hidden><div class="small" id="ustat"></div><div class="bar" style="width:100%"><b id="ubar"></b></div></div>
    <div class="err" id="uerr"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal" id="ucancel">Отмена</button><button class="btn" id="ugo">Загрузить</button></div></div></div>`;
  $('#ufile').onchange = e => { const f = e.target.files[0]; if (f && !$('#utitle').value) $('#utitle').value = f.name.replace(/\.[^.]+$/, '').slice(0, 120); };
  $('#ugo').onclick = doUpload;
}
function videoMeta(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), v = document.createElement('video');
    v.preload = 'metadata'; v.muted = true; v.playsInline = true; v.src = url;
    const fail = () => { URL.revokeObjectURL(url); res({ dur: 0, thumb: null }); };
    v.onerror = fail;
    v.onloadedmetadata = () => { v.currentTime = Math.min(1, (v.duration || 1) / 4); };
    v.onseeked = () => {
      try {
        const w = 480, h = Math.round(w * v.videoHeight / v.videoWidth) || 270, c = document.createElement('canvas');
        c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
        c.toBlob(b => { URL.revokeObjectURL(url); res({ dur: v.duration, thumb: b }); }, 'image/jpeg', .8);
      } catch { fail(); }
    };
    setTimeout(fail, 15000);
  });
}
async function doUpload() {
  const file = $('#ufile').files[0], title = $('#utitle').value.trim(), kind = $('#ukind').value, err = $('#uerr');
  if (!file) { err.textContent = 'Выберите видеофайл'; return; }
  if (!file.type.startsWith('video/')) { err.textContent = 'Это не видеофайл'; return; }
  if (!title) { err.textContent = 'Введите название'; return; }
  err.textContent = ''; $('#ugo').disabled = true; $('#ucancel').disabled = true; $('#uprog').hidden = false;
  const stat = $('#ustat'), bar = $('#ubar');
  const id = crypto.randomUUID(), parts = Math.max(1, Math.ceil(file.size / CHUNK));
  const mime = file.type || 'video/mp4';
  const rec = { id, owner: me.id, mime };
  try {
    stat.textContent = 'Готовлю обложку…';
    const { dur, thumb } = await videoMeta(file);
    if (kind === 'gubap' && dur > GUBAP_MAX_SEC) throw new Error(`ГУБАП должен быть не длиннее ${GUBAP_MAX_SEC / 60} минут`);
    let thumbUrl = null;
    if (thumb) {
      const tp = `${me.id}/${id}.jpg`;
      const { error } = await sb.storage.from('images').upload(tp, thumb, { contentType: 'image/jpeg' });
      if (!error) thumbUrl = pub('images', tp);
    }
    for (let i = 0; i < parts; i++) {
      const blob = file.slice(i * CHUNK, Math.min(file.size, (i + 1) * CHUNK));
      stat.textContent = parts > 1 ? `Часть ${i + 1} из ${parts}…` : 'Загружаю видео…';
      let ok = false, last;
      for (let t = 0; t < 3 && !ok; t++) {
        const { error } = await sb.storage.from('videos').upload(partPath(rec, i), blob, { contentType: parts > 1 ? 'application/octet-stream' : mime, upsert: true });
        if (error) { last = error; await new Promise(r => setTimeout(r, 1200 * (t + 1))); } else ok = true;
      }
      if (!ok) throw new Error(last?.message || 'Ошибка загрузки части ' + (i + 1));
      bar.style.width = Math.round((i + 1) / parts * 100) + '%';
    }
    const { error } = await sb.from('videos').insert({
      id, owner: me.id, kind, title, description: $('#udesc').value.trim(), mime, size_bytes: file.size, parts, thumb_url: thumbUrl
    });
    if (error) throw error;
    closeModal(); toast('Видео опубликовано');
    location.hash = kind === 'gubap' ? '#/gubaps/' + id : '#/watch/' + id;
  } catch (e) {
    err.textContent = e.message || 'Ошибка'; $('#ugo').disabled = false; $('#ucancel').disabled = false;
    if (/exceeded|too large|size/i.test(err.textContent)) err.textContent += ' (проверьте лимит размера файла в Supabase: Storage → Settings)';
  }
}

      <input id="ebWhy" maxlength="300" placeholder="Причина" style="flex:1;min-width:140px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px"><button class="btn danger">Забанить по почте</button></form>
      <p class="muted small">Если человека ещё нет на сайте, бан сработает сразу при его регистрации с этой почтой.</p>
      ${rows.length ? `<div class="tw"><table><thead><tr><th>Кто</th><th>Срок</th><th>Причина</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${r.kind === 'user' ? `<b>@${esc(r.nick || '—')}</b> <span class="muted small">${esc(r.email)}</span>` : `<span class="muted small">${esc(r.email)}</span> <span class="tag">ждёт регистрации</span>`}</td><td>${st(r)}</td><td>${esc(r.reason)}</td>
      <td><button class="btn ghost sm" data-act="${r.kind === 'user' ? 'admUnban' : 'admUnbanEmail'}" data-id="${r.user_id || ''}" data-e="${esc(r.email)}">Разбанить</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">Банов нет.</div>'}`;
  }
  app.innerHTML = `<h1>Админ-панель</h1><div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button class="${admTab === k ? 'on' : ''}" data-act="admTab" data-id="${k}" role="tab">${n}</button>`).join('')}</div><div>${body}</div>`;
  const eb = $('#ebForm');
  if (eb) eb.onsubmit = async e => {
    e.preventDefault();
    const r = await sb.rpc('admin_ban_email', { em: $('#ebEmail').value, hrs: +$('#ebDur').value, why: $('#ebWhy').value.trim() });
    if (admErr(r)) return; admDone(r.data === 'user' ? 'Пользователь забанен' : 'Почта в бане: сработает при регистрации');
  };
  const f = $('#admSearch'); if (f) f.onsubmit = e => { e.preventDefault(); admQ = $('#admq').value.trim(); viewAdmin(); };
}
const admDone = (t) => { toast(t); viewAdmin(); };
const admErr = r => r.error && (toast(r.error.message), true);
Object.assign(actions, {
  async admUnbanEmail(el) { if (admErr(await sb.rpc('admin_unban_email', { em: el.dataset.e }))) return; admDone('Разбанен'); },
  async admFeature(el) { if (admErr(await sb.from('videos').update({ featured_at: el.dataset.f ? null : new Date().toISOString() }).eq('id', el.dataset.id))) return; admDone(el.dataset.f ? 'Снято с главной' : 'Показывается на главной'); },
  admTab(el) { admTab = el.dataset.id; viewAdmin(); },
  admBan(el) {
    $('#modalHost').innerHTML = `<div class="back"><div class="modal" role="dialog"><h2>Бан @${esc(el.dataset.n)}</h2>
      <label>На сколько<select id="bdur">${DUR.map(([n, h]) => `<option value="${h}">${n}</option>`).join('')}<option value="x">Свой срок (в часах)…</option></select></label>
      <label id="bcw" hidden>Часов<input id="bcustom" type="number" min="1" value="12"></label>
      <label>Причина (увидит пользователь)<textarea id="breason" rows="2" maxlength="300"></textarea></label>
      <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="closeModal">Отмена</button><button class="btn danger" id="bgo">Забанить</button></div></div></div>`;
    $('#bdur').onchange = e => $('#bcw').hidden = e.target.value !== 'x';
    $('#bgo').onclick = async () => {
      let h = $('#bdur').value; h = h === 'x' ? Math.max(1, +$('#bcustom').value || 1) : +h;
      const until = h ? new Date(Date.now() + h * 3600e3).toISOString() : null;
      const r = await sb.from('bans').upsert({ user_id: el.dataset.id, until, reason: $('#breason').value.trim(), banned_by: me.id });
      if (admErr(r)) return; closeModal(); admDone('Пользователь забанен');
    };
  },
  async admUnban(el) { if (admErr(await sb.from('bans').delete().eq('user_id', el.dataset.id))) return; admDone('Разбанен'); },
  async admVerify(el) { if (admErr(await sb.from('profiles').update({ verified: !el.dataset.v }).eq('id', el.dataset.id))) return; admDone('Готово'); },
  async admClear(el) {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Точно?'; setTimeout(() => { el.dataset.sure = ''; el.textContent = 'Стереть комменты'; }, 4000); return; }
    if (admErr(await sb.rpc('admin_clear_user_comments', { uid: el.dataset.id }))) return; admDone('Комментарии удалены');
  },
  async admDelComment(el) { if (admErr(await sb.from('comments').delete().eq('id', el.dataset.id))) return; admDone('Комментарий удалён'); },
  async admDelVideo(el) {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Точно удалить?'; setTimeout(() => { el.dataset.sure = ''; el.textContent = 'Удалить'; }, 4000); return; }
    const { data: v } = await sb.from('videos').select('*').eq('id', el.dataset.id).single();
    if (!v) return;
    await sb.storage.from('videos').remove(Array.from({ length: v.parts }, (_, i) => partPath(v, i)));
    await sb.storage.from('images').remove([`${v.owner}/${v.id}.jpg`]);
    if (admErr(await sb.rpc('admin_delete_video', { vid: v.id }))) return; admDone('Видео удалено');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#sheetHost').innerHTML = ''; });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if (!e.target.closest('.menu')) $('#menuHost').innerHTML = ''; return; }
  e.preventDefault(); const f = actions[el.dataset.act]; if (f) f(el);
});
$('#searchForm').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); location.hash = q ? '#/search/' + encodeURIComponent(q) : '#/'; };

/* ============ Маршрутизация ============ */
function route() {
  $('#sheetHost').innerHTML = '';
  if (cleanup) { cleanup(); cleanup = null; }
  $$('video').forEach(v => v.pause());
  const [, page = '', arg = ''] = (location.hash || '#/').slice(1).split('/');
  const nav = { '': 'home', search: 'home', gubaps: 'gubaps', subs: 'subs', studio: 'studio', channel: 'studio', admin: 'admin' }[page];
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav && !(page === 'channel')));
  window.scrollTo(0, 0);
  if (page === 'watch') viewWatch(arg);
  else if (page === 'gubaps') viewGubaps(arg);
  else if (page === 'channel') viewChannel(arg);
  else if (page === 'studio') viewStudio();
  else if (page === 'admin') viewAdmin();
  else if (page === 'subs') viewSubs();
  else if (page === 'search') viewHome(decodeURIComponent(arg));
  else viewHome();
}
window.addEventListener('hashchange', route);
window.addEventListener('offline', () => toast('Нет подключения к интернету'));
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
sb.auth.onAuthStateChange((ev) => {
  if (ev === 'PASSWORD_RECOVERY') setTimeout(openNewPass, 600); if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') setTimeout(async () => { await loadMe(); route(); }, 0); });
(async () => { await loadMe(); route(); })();
</script>
</body>
</html>
